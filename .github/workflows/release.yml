name: Release

# Builds a signed release APK and attaches it to a GitHub Release.
#
# Trigger: pushing a tag like v1.0.0. The tag is the single source of truth for the
# version, so the APK's versionName and the Release name can never disagree.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   RELEASE_KEYSTORE_BASE64    base64 of the .jks file  (base64 -w0 release.jks)
#   RELEASE_KEYSTORE_PASSWORD  keystore password
#   RELEASE_KEY_ALIAS          key alias inside the keystore
#   RELEASE_KEY_PASSWORD       key password
#
# Without those secrets the build still compiles, but it cannot sign, and this workflow
# fails rather than publishing an unusable APK.

on:
  push:
    tags:
      - 'v*'
  # Manual runs, useful for testing the pipeline without tagging.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name to build (e.g. 1.0.0). Defaults to the tag or gradle default.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build signed release
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          set -euo pipefail
          RAW="${{ github.event.inputs.version || '' }}"
          if [ -z "$RAW" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RAW="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$RAW" ]; then
            RAW="1.0.0"
          fi
          # major * 10000 + minor * 100 + patch, matching app/build.gradle.kts
          BASE="${RAW%%-*}"
          MAJOR="$(echo "$BASE" | cut -d. -f1)"
          MINOR="$(echo "$BASE" | cut -d. -f2)"
          PATCH="$(echo "$BASE" | cut -d. -f3)"
          CODE=$(( MAJOR * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          echo "name=$RAW" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $RAW (code $CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Must be v4 or newer. v3 shells out to `sdkmanager tools` during setup, and Google
      # no longer serves that package, so the job dies with "Failed to find package
      # 'tools'" before Gradle is ever reached. v4 installs only platform-tools and its
      # contents now live in the cmdline-tools it puts on PATH.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # sdkmanager prints "The SDK Manager CLI tool (sdkmanager) is deprecated. Use Android
      # CLI instead." That warning is benign and expected here: the tool still works, and
      # the `android` replacement is not reliably present (setup-android's own internals
      # still call sdkmanager, and the `android` binary is absent from several
      # cmdline-tools versions). Keeping the warning is cheaper than depending on a binary
      # that may not exist on the runner.
      - name: Install required SDK platforms
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set; cannot sign the release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build and sign
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./release.sh "${{ steps.version.outputs.name }}" "${{ steps.version.outputs.code }}"

      - name: Verify signature and record checksums
        run: |
          set -euo pipefail
          APK="dist/immich-file-picker-${{ steps.version.outputs.name }}.apk"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
          # Fail if the publisher is not the expected company: a release signed by any
          # other key would be rejected by devices with the real app installed.
          "$APKSIGNER" verify --print-certs "$APK" | grep -q "O=Virtunio Ltd" \
            || { echo "::error::APK is not signed by Virtunio Ltd"; exit 1; }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.version.outputs.name }}"
          NOTES="Signed release of Immich File Picker ${VERSION}.

          Publisher: Virtunio Ltd
          Package: com.virtunio.immichpicker
          Minimum Android: 8.0 (API 26)

          Verify the download before installing:

          \`\`\`bash
          sha256sum -c immich-file-picker-${VERSION}.apk.sha256
          \`\`\`"

          # Re-running a release replaces the assets instead of failing on an existing tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "Immich File Picker ${VERSION}" --notes "$NOTES"
          else
            gh release create "$TAG" dist/* \
              --title "Immich File Picker ${VERSION}" \
              --notes "$NOTES" \
              --verify-tag
          fi
