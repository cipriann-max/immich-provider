name: Release

# Builds a signed release APK and attaches it to a GitHub Release.
#
# Trigger: pushing a tag like v1.0.0. The tag is the single source of truth for the
# version, so the APK's versionName and the Release name can never disagree.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   RELEASE_KEYSTORE_BASE64    base64 of the .jks file  (base64 -w0 release.jks)
#   RELEASE_KEYSTORE_PASSWORD  keystore password
#   RELEASE_KEY_ALIAS          key alias inside the keystore
#   RELEASE_KEY_PASSWORD       key password
#
# Without those secrets the build still compiles, but it cannot sign, and this workflow
# fails rather than publishing an unusable APK.

on:
  push:
    tags:
      - 'v*'
  # Manual runs, useful for testing the pipeline without tagging.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name to build (e.g. 1.2.0). Defaults to the tag or the gradle default.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build signed release
    runs-on: ubuntu-latest
    steps:
      # These action majors are the ones that run on Node.js 24, which is what
      # `ubuntu-latest` expects; older pins are force-migrated and log a deprecation
      # warning on every job. Keep them in step with ci.yml.
      - name: Check out
        uses: actions/checkout@v7

      - name: Derive version from tag
        id: version
        run: |
          set -euo pipefail
          RAW="${{ github.event.inputs.version || '' }}"
          if [ -z "$RAW" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RAW="${GITHUB_REF_NAME#v}"
          fi
          # Last-resort fallback, used only for a manual dispatch with no version input
          # and no tag. Keep in step with defaultVersionName in app/build.gradle.kts.
          if [ -z "$RAW" ]; then
            RAW="1.3.0"
          fi
          # major * 10000 + minor * 100 + patch, matching app/build.gradle.kts
          BASE="${RAW%%-*}"
          MAJOR="$(echo "$BASE" | cut -d. -f1)"
          MINOR="$(echo "$BASE" | cut -d. -f2)"
          PATCH="$(echo "$BASE" | cut -d. -f3)"
          CODE=$(( MAJOR * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          echo "name=$RAW" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $RAW (code $CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Must be v4 or newer. v3 shells out to `sdkmanager tools` during setup, and Google
      # no longer serves that package, so the job dies with "Failed to find package
      # 'tools'" before Gradle is ever reached. v4 installs only platform-tools and its
      # contents now live in the cmdline-tools it puts on PATH.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # sdkmanager prints "The SDK Manager CLI tool (sdkmanager) is deprecated. Use Android
      # CLI instead." That warning is benign and expected here: the tool still works, and
      # the `android` replacement is not reliably present (setup-android's own internals
      # still call sdkmanager, and the `android` binary is absent from several
      # cmdline-tools versions). Keeping the warning is cheaper than depending on a binary
      # that may not exist on the runner.
      - name: Install required SDK platforms
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set; cannot sign the release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # A corrupt secret is the one failure the signing step cannot explain: Gradle reports
      # "DerInputStream.getLength(): lengthTag=N, too big", which says nothing about the
      # cause. Validate the decoded file here instead, and print its fingerprint so the
      # upload can be compared against the keystore on the developer's machine without
      # ever revealing secret material.
      - name: Validate keystore
        env:
          # Needed for the length report below; `set -u` aborts on an unset variable.
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.jks"
          SIZE="$(stat -c %s "$KS")"
          SHA="$(sha256sum "$KS" | cut -d' ' -f1)"
          MAGIC="$(head -c 4 "$KS" | od -An -tx1 | tr -d ' \n')"
          echo "Keystore bytes : $SIZE"
          echo "Keystore sha256: $SHA"
          echo "First 4 bytes  : $MAGIC"
          SECRET_LEN="$(printf '%s' "${KEYSTORE_BASE64:-}" | wc -c)"
          echo "Secret length  : $SECRET_LEN base64 chars"
          echo "Compare 'Keystore sha256' with \`sha256sum ~/keystores/<file>.jks\` locally;"
          echo "the values must match, otherwise the secret was mangled on upload."

          # Only the leading marker is stable. For PKCS12 the bytes are
          # 30 82 <length hi> <length lo>: a DER SEQUENCE with a two-byte length,
          # so the last two bytes encode the file size and differ for any other
          # keystore. Matching the full four bytes once worked only because the
          # current file happens to be 4418 bytes long (0x1142).
          if [[ "$MAGIC" != 3082* && "$MAGIC" != "feedfeed" ]]; then
            echo "::error::The decoded secret is not a keystore (first bytes $MAGIC)."
            echo "Expected 3082... (PKCS12) or feedfeed (JKS). The base64 in"
            echo "RELEASE_KEYSTORE_BASE64 is truncated, wrapped, or has extra characters."
            exit 1
          fi

          # An unset secret expands to nothing here; report it rather than tripping over
          # `set -u`, so a missing password reads as a missing secret and not a shell error.
          if [ -z "${RELEASE_KEYSTORE_PASSWORD:-}" ] || [ -z "${RELEASE_KEY_ALIAS:-}" ]; then
            echo "::error::RELEASE_KEYSTORE_PASSWORD and RELEASE_KEY_ALIAS must both be set."
            exit 1
          fi

          # Opening the store proves the password decrypts it; listing the alias proves the
          # key the build will sign with is actually present.
          if ! keytool -list -keystore "$KS" -storepass "$RELEASE_KEYSTORE_PASSWORD" \
                -alias "$RELEASE_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Cannot open the keystore with RELEASE_KEYSTORE_PASSWORD / RELEASE_KEY_ALIAS."
            echo "Check both secrets; keytool stderr follows (no secret is printed):"
            keytool -list -keystore "$KS" -storepass "$RELEASE_KEYSTORE_PASSWORD" || true
            exit 1
          fi
          echo "OK: keystore opens and alias '$RELEASE_KEY_ALIAS' is present."

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build and sign
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./release.sh "${{ steps.version.outputs.name }}" "${{ steps.version.outputs.code }}"

      - name: Verify signature
        run: |
          set -euo pipefail
          APK="dist/immich-file-picker-${{ steps.version.outputs.name }}.apk"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          # Fails on an unsigned APK. The certificate is not asserted: it is the builder's
          # key, and a fork legitimately signs with a different one. The output is kept so
          # the release notes can publish the digest the APK was actually signed with.
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/signature.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.version.outputs.name }}"
          SIGNER="$(grep -m1 'certificate DN' "$RUNNER_TEMP/signature.txt" 2>/dev/null || echo 'unknown')"

          # Release body = the matching CHANGELOG.md section, so the notes describe what
          # actually changed instead of repeating a generic blurb. The section runs from
          # "## [<version>]" to the next "## [". If it is missing (a version bumped in the
          # build script but never written up), the release still publishes and says so.
          SECTION=""
          if [ -f CHANGELOG.md ]; then
            # Link-reference definitions at the bottom of the file (e.g. "[1.1.0]: https://…")
            # are not part of the prose, so they are dropped rather than pasted into the notes.
            SECTION="$(awk -v want="## [${VERSION}]" '
              index($0, want) == 1 { capture = 1; next }
              capture && /^## \[/ { exit }
              capture && /^\[[^]]+\]: / { next }
              capture { print }
            ' CHANGELOG.md)"
          fi
          if [ -z "$SECTION" ]; then
            SECTION="No CHANGELOG.md entry for ${VERSION}. See the repository history for the
          full list of changes."
          fi

          {
            printf 'Source: %s\n' "https://github.com/${{ github.repository }}"
            printf 'Application id: com.virtunio.immichpicker\n'
            printf 'Minimum Android: 8.0 (API 26)\n\n'
            printf '%s\n\n' "$SECTION"
            printf 'Verify the download before installing:\n\n'
            printf '```bash\n'
            printf 'sha256sum -c immich-file-picker-%s.apk.sha256\n' "$VERSION"
            printf '```\n\n'
            # The build is signed by whoever owns this repository's keystore secret, so
            # publish the digest rather than asserting a particular certificate.
            printf 'Signed with:\n\n'
            printf '```\n'
            printf '%s\n' "$SIGNER"
            printf '```\n'
          } > "$RUNNER_TEMP/notes.md"

          # Re-running a release replaces the assets instead of failing on an existing tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "Immich File Picker ${VERSION}" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" dist/* \
              --title "Immich File Picker ${VERSION}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag
          fi
