name: CI

# Validates every push to main and every pull request.
#
# Deliberately does NOT sign anything: an unsigned build is enough to prove the project
# compiles and the tests pass, and it keeps the release secrets out of PR-triggered runs
# (a fork's PR must never be able to read them).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      # Every action here targets the Node.js 24 runtime, which is the requirement for
      # `ubuntu-latest` today: Node 20 actions are force-migrated and print a deprecation
      # warning on every run. The floors below are the first majors that ship node24 --
      # checkout 5+, cache 5+, setup-java 5+, upload-artifact 6+ -- so take the current
      # major rather than the minimum, and keep them in step with release.yml.
      #
      # Do not downgrade upload-artifact to v3: it is pinned to Node 20 and still uses the
      # retired v1 artifact backend.
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Must be v4 or newer. v3 shells out to `sdkmanager tools` during setup, and Google
      # no longer serves that package, so the job dies with "Failed to find package
      # 'tools'" before Gradle is ever reached. v4 installs only platform-tools and its
      # contents now live in the cmdline-tools it puts on PATH.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # sdkmanager prints "The SDK Manager CLI tool (sdkmanager) is deprecated. Use Android
      # CLI instead." That warning is benign and expected here: the tool still works, and
      # the `android` replacement is not reliably present (setup-android's own internals
      # still call sdkmanager, and the `android` binary is absent from several
      # cmdline-tools versions). Keeping the warning is cheaper than depending on a binary
      # that may not exist on the runner.
      - name: Install required SDK platforms
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
